- name: PhariaInference API
  description: >-
    The PhariaInference HTTP API provides access to Aleph Alpha's specialized
    language models for text completion, chat completions, embeddings, semantic
    (symmetric and asymmetric) search, tokenization/detokenization, and
    explainability. Requests are authenticated with a bearer API token obtained
    from the Aleph Alpha account portal.
