aid: aleph-alpha2
name: Aleph Alpha2
description: >-
  Aleph Alpha is a Heidelberg, Germany-based artificial intelligence company
  building sovereign, specialized large language models (SLLMs) for European
  enterprises and public-sector organizations operating in regulated and
  sensitive domains. Its PhariaAI suite is an end-to-end, self-hostable stack —
  PhariaStudio for building AI applications, PhariaAssistant for knowledge
  workers, and PhariaOS for resource management, alongside the PhariaInference,
  PhariaSearch, and PhariaData APIs — engineered for data sovereignty,
  transparency, and EU regulatory compliance while running on European
  infrastructure. The PhariaInference HTTP API exposes text completion, chat,
  embeddings, semantic search, tokenization, and explainability, accessed with a
  bearer token issued from app.aleph-alpha.com and supported by an official
  open-source Python client.
